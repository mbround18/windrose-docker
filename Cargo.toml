[package]
name = "gsm-windrose"
version = "0.1.0"
edition = "2024"

[dependencies]
# CLI Argument Parsing
clap = { version = "4.5", features = ["derive"] }

# Asynchronous Runtime
tokio = { version = "1.38", features = ["full"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization/Deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
anyhow = "1.0"

# Game Server Management libs
gsm-instance = { git = "https://github.com/mbround18/game-server-management.git" }
env-parse = { git = "https://github.com/mbround18/game-server-management.git" }
gsm-monitor = { git = "https://github.com/mbround18/game-server-management.git" }
gsm-cron = { git = "https://github.com/mbround18/game-server-management.git" }

[dev-dependencies]
# Temporary files for testing
tempfile = "3.10"
